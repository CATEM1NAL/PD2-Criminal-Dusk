## Perk Decks
menu_deck2_1_skill: "$lv1;Max health increased by ##10##.\n\n$lv2;Max health increased by ##20##.\n\n$lv3;Max health increased by ##40##.\n\n$lv4;Max health increased by ##80##.\n\n$lv5;Max health increased by ##100##.\n\n$lv6;Your armor is converted into health."

menu_deck2_7_skill: "$lv1;Suppressed enemies can panic. Enemies are ##15%## more likely to target you."

menu_armorer_skill: "Impact Plate"
menu_armorer_skill_desc: "$lv1;Armor increased by ##5%##.\n\n$lv2;Armor increased by ##10%##.\n\n$lv3;Armor increased by ##20%##.\n\n$lv4;Armor increased by ##30%##.\n\n$lv5;Armor increased by ##40%##.\n\n$lv6;Your armor is constantly recovering at a slower rate. This recovery cannot be accelerated."

menu_yakuza_speed: "Adrenaline"
menu_yakuza_speed_desc: "$lv1;While below ##50%## health your armor recovery speed scales with health lost, to a maximum of ##60%##.\n\n$lv2;Movement speed also increases by up to ##20%## with health lost."

menu_deck4_5_skill: "$lv1;Dodge increased by ##15##.\n\n$lv2;Dodge increased by ##30##.\n\n$lv3;Dodge increased by ##45##.\n\n$lv4;Dodge increased by ##60##.\n\n$lv5;Dodge increased by ##80##.\n\n$lv6;Dodging a bullet damages the enemy that fired it."

menu_rogue_switch: "$lv1;Weapon switch speed is increased by ##80%##.\n\n$lv2;Weapon switch speed is increased by ##160%##.\n\n$lv3;Weapon switch speed is increased by ##320%##."

menu_hitman_skill_desc: "$lv1;Armor recovers ##5%## faster.\n\n$lv2;Armor recovers ##15%## faster.\n\n$lv3;Armor recovers ##25%## faster.\n\n$lv4;Armor recovers ##35%## faster.\n\n$lv5;Armor recovers ##45%## faster.\n\n$lv6;When your armor breaks it will recover at twice the normal speed (minimum of ##3## seconds), regardless of the situation.\n"

menu_break_skill: "$lv1;Store ##4## health per crew kill that is consumed on armor recovery.\n\n$lv2;Store ##8## health per crew kill.\n\n$lv3;Store ##12## health per crew kill."

menu_crook_skill: "Composure"
menu_crook_skill_desc: "$lv1;Ballistic vests have their armor increased by ##20%## and their dodge increased by ##5##.\n\n$lv2;Armor is now increased by ##40%## and dodge is increased by ##15##.\n\n$lv3;Armor is increased further to ##65%## and dodge is increased by ##25##."

menu_burglar_stealth: "$lv1;Bag corpses ##20%## faster.\n\n$lv2;Answer pagers ##10%## faster.\n\n$lv3;Pick locks ##20%## faster."

menu_infil_melee: "Psychopath"
menu_infil_melee_desc: "$lv1;Consecutive melee hits performed within ##1## second deal ##10x## damage.\n\n$lv2;Damage boost is now active for ##7## seconds."
menu_infil_close: "Close Combat"
menu_infil_close_desc: "$lv1;Gain ##8%## damage reduction while an enemy is within ##18m## of you.\n\n$lv2;Damage reduction is now ##16%##.\n\n$lv3;Damage reduction is now ##24%##."
menu_infil_heal_desc: "$lv1;Heal ##20%## of your max health when dealing melee damage. This can only occur once every ##10## seconds.\n\n$lv2;Heal ##10%## of your max health on melee kill."

menu_deck14_1_skill: "$lv1;Every ##2## seconds you and the crew gain ##1## damage absorption (up to ##20##) for every ##30## damage you dealt during that period.\n\n$lv2;Damage required is now ##25## per point of damage absorption.\n\n$lv3;Any damage absorption you apply to yourself is doubled."

menu_anarch_rise: "$lv1;Armor is increased by ##50##, but health is reduced by ##50##.\n\n$lv2;Armor is increased by ##100##, but health is reduced by ##75##.\n\n$lv3;Armor is increased by ##150##, but health is reduced by ##100##."

menu_mag_throw: "Mag Throw"
menu_mag_throw_desc: "$lv1;Picking up ammo triggers a half ammo pickup for the rest of the crew. Can only occur once every ##5## seconds."

menu_gambler_heal: "$lv1;Picking up ammo heals you for ##16## to ##24## health. The crew heals for ##50%## of your healing. This can only happen once every ##3## seconds.\n\n$lv2;Healing is increased to ##24## to ##32## health.\n\n$lv3;Healing is further increased to ##32## to ##40## health."

menu_kingpin_priority: "$lv1;Target priority is increased by ##1000%## while the ##Injector## is active."
menu_kingpin_cooldown: "$lv1;Cooldown of the ##Injector## is reduced by ##1## second for every ##50## health restored while at max health."
menu_kingpin_healing: "$lv1;While the ##Injector## is active and you are below half health, all damage taken becomes healing."

menu_stoic_skill: "$lv1;Unlocks the ##Stoic's Hip Flask##. ##25%## of damage taken is applied instantly, while the remaining ##75%## is applied over ##12## seconds. Using the flask negates any remaining damage with a ##10## second cooldown, reduced by ##1## second per kill.\n\n$lv2;Cooldown is reduced by ##2## seconds per kill when health is below ##35%##."
menu_stoic_negation: "$lv1;Remaining damage from ##Virtue## is negated after not taking damage for ##4## seconds."
menu_stoic_regen: "$lv1;##50%## of negated damage from ##Virtue## is turned into healing."

menu_h3h3_cooldown: "$lv1;Kills from your ##Gas Dispenser## target decrease the cooldown by ##2## seconds."
menu_h3h3_absorb: "$lv1;Kills from you or your ##Gas Dispenser## target grant ##2## absorption (max ##20##) while the Gas Dispenser is active."

menu_leech_swan: "$lv1;Running out of health while the ##Leech Ampule## is active allows you to keep fighting with ##80%## reduced movement speed.\n\n$lv2;The ##Leech Ampule## can be used while down to get back up temporarily. Using a ##doctor bag## or reviving a crewmate allows you to stay up if you have health when the effect ends."
menu_leech_duration: "$lv1;Cooldown of the ##Leech Ampule## is reduced by ##1## second per kill.\n\n$lv2;Effect of the ##Leech Ampule## now lasts ##10## seconds."
menu_leech_healing: "$lv1;Crewmates recover ##10## health when you take damage while the ##Leech Ampule## is active."
menu_leech_segments: "$lv1;Activating the ##Leech Ampule## divides your health into ##10## segments."

menu_tac_reload: "Tactical Reload"
menu_tac_reload_desc: "$lv1;Your unequipped weapon is reloaded after ##10## kills.\n\n$lv2;Weapon switch speed is increased by ##160%## for ##3## seconds after reload is triggered."